name: Update AltStore Source

on:
  schedule:
    - cron: '0 */12 * * *' # Run every 12 hours
  workflow_dispatch:      # Manual trigger from Actions tab
  push:
    paths:
      - 'repos.json'
      - 'config.json'
      - 'bin/altmaker'

concurrency:
  group: altmaker-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Releases & Update AltMaker.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Altmaker Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./bin/altmaker
          ./bin/altmaker -config ./config.json -repos ./repos.json

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AltMaker.json
          if [ -d "icons" ]; then
            git add icons/
          fi
          if git diff --staged --quiet; then
            echo "No changes detected. Source is up to date."
          else
            git commit -m "chore(source): sync latest app releases [skip ci]"
            git push
          fi
